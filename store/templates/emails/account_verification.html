<!doctype html>
<html lang="en">
  <body>
    <h1>Verify your Jasiri account</h1>
    <p>Hello {{ user.username }},</p>
    <p>Confirm your email address to activate your account.</p>
    <p><a href="{{ protocol }}://{{ domain }}{% url 'store:activate_account' uidb64=uid token=token %}">Verify email address</a></p>
    <p>If you did not create this account, you can ignore this email.</p>
  </body>
</html>
