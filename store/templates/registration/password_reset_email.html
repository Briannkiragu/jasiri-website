<!doctype html>
<html lang="en">
  <body>
    <h1>Reset your Jasiri password</h1>
    <p>We received a request to reset the password for your Jasiri account.</p>
    <p><a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}">Choose a new password</a></p>
    <p>If you did not request this, you can ignore this email.</p>
  </body>
</html>
